<a class="card card-link {{cardSize}} {{cardInverted}}" href="/projects/{{project.id}}">
  <div>
    <div>
      <h3><strong>{{project.firstName}}</strong>{{project.lastName}}</h3>
      <p>{{project.tag}}</p>
    </div>
  </div>
  <img
    src="{{project.thumbnail}}"
    alt="{{project.firstName}}{{project.lastName}} Project Thumbnail"
    width="358"
    height="261"
    loading="lazy"
    decoding="async"
  />
</a>
